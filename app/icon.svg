<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="50%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Black background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="#0a0a0a"/>
  
  <!-- Subtle border glow -->
  <rect x="3" y="3" width="506" height="506" rx="106" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  
  <!-- Decorative corner accent top-left -->
  <line x1="60" y1="80" x2="130" y2="80" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="60" y1="80" x2="60" y2="140" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Decorative corner accent bottom-right -->
  <line x1="382" y1="432" x2="452" y2="432" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="452" y1="372" x2="452" y2="432" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Main "PA" text with elegant styling -->
  <text x="256" y="275" text-anchor="middle" dominant-baseline="central" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-weight="400" font-size="200" fill="url(#textGrad)" 
        letter-spacing="12" font-style="italic" filter="url(#softShadow)">PA</text>
  
  <!-- Elegant underline accent -->
  <line x1="120" y1="385" x2="392" y2="385" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Small dot accents -->
  <circle cx="105" cy="385" r="4" fill="url(#accent)" opacity="0.8"/>
  <circle cx="407" cy="385" r="4" fill="url(#accent)" opacity="0.8"/>
</svg>
